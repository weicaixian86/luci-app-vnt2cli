<%
local dsp = require "luci.dispatcher"
local toml_read_url = dsp.build_url("admin", "vpn", "vnt2", "toml_read")
local toml_save_url = dsp.build_url("admin", "vpn", "vnt2", "toml_save")
%>

<style type="text/css">
	.vnt2-toml-toolbar {
		display: flex;
		align-items: center;
		gap: 10px;
		margin: 0 0 8px;
		flex-wrap: wrap;
	}
	.vnt2-toml-note {
		font-size: 12px;
		color: #888;
	}
	#vnt2_toml_editor {
		width: 100%;
		box-sizing: border-box;
		min-height: 380px;
		font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
		font-size: 12px;
		line-height: 1.5;
		white-space: pre;
		resize: vertical;
	}
	.vnt2-toml-msg {
		font-size: 13px;
		margin: 8px 0 0;
		min-height: 18px;
	}
	.vnt2-toml-msg.ok {
		color: #19a15f;
	}
	.vnt2-toml-msg.err {
		color: #d9534f;
	}
</style>

<div>
	<div class="vnt2-toml-toolbar">
		<input class="cbi-button cbi-button-apply" type="button" onclick="vnt2TomlSave()" value="<%:保存配置%>" />
		<input class="cbi-button" type="button" onclick="vnt2TomlReload()" value="<%:重新加载%>" />
		<span class="vnt2-toml-note"><%:保存只更新文本中出现的键，未出现的键保持不变（删除参数请使用设置表单）；保存后写回插件配置并由后台重启客户端生效。重新加载读取运行中的 /tmp/vnt2cli.toml。%></span>
	</div>
	<textarea id="vnt2_toml_editor" class="cbi-input-textarea" spellcheck="false" wrap="off"><%=self:cfgvalue(section)%></textarea>
	<div class="vnt2-toml-msg" id="vnt2_toml_msg"></div>
</div>

<script type="text/javascript">
//<![CDATA[
(function() {
	var readUrl = "<%=toml_read_url%>";
	var saveUrl = "<%=toml_save_url%>";
	var dirty = false;

	function editor() {
		return document.getElementById("vnt2_toml_editor");
	}

	function setMessage(text, ok) {
		var node = document.getElementById("vnt2_toml_msg");
		if (!node) return;
		node.textContent = text || "";
		node.className = "vnt2-toml-msg " + (ok ? "ok" : "err");
	}

	function reload() {
		XHR.get(readUrl, null, function(x, data) {
			if (data && data.ok) {
				editor().value = data.content || "";
				dirty = false;
				setMessage(data.source === "file"
					? "已加载运行配置 /tmp/vnt2cli.toml（客户端实际加载的完整配置）"
					: "客户端未运行或运行配置尚未生成，已显示当前配置的序列化文本", true);
			} else {
				setMessage((data && data.error) || "读取配置失败", false);
			}
		});
	}

	window.vnt2TomlReload = reload;

	window.vnt2TomlSave = function() {
		var content = editor().value;
		if (!/\S/.test(content)) {
			setMessage("配置内容不能为空", false);
			return;
		}
		XHR.post(saveUrl, { content: content }, function(x, data) {
			if (data && data.ok) {
				dirty = false;
				setMessage((data.hint || "已保存。") + " 页面即将刷新以同步表单取值…", true);
				// The rest of the form still holds the values rendered before
				// this editor save. Reload so a later form submit cannot write
				// those stale values back over the edited config.
				window.setTimeout(function() {
					window.location.reload();
				}, 1500);
			} else {
				setMessage((data && data.error) || "保存失败", false);
			}
		});
	};

	var node = editor();
	if (node) {
		node.addEventListener("input", function() {
			dirty = true;
		});

		// Refresh the editor text whenever its tab becomes visible, unless the
		// user has unsaved edits. Without this the pane keeps the snapshot taken
		// at page render and a later save would write that stale text back over
		// newer form changes.
		var pane = document.querySelector('.cbi-tabcontainer[data-tab="edit"]');
		if (pane && pane.addEventListener) {
			pane.addEventListener("cbi-tab-active", function() {
				if (!dirty) {
					reload();
				}
			});
		}
	}

	// A back/forward cache restore brings back the DOM of an older render - both
	// the form fields and this editor would then hold pre-save values that a
	// later save writes over the current configuration. Reload such restores.
	window.addEventListener("pageshow", function(ev) {
		if (ev && ev.persisted) {
			window.location.reload();
		}
	});

	if (node && node.value.replace(/\s/g, "") === "") {
		reload();
	}
})();
//]]>
</script>
